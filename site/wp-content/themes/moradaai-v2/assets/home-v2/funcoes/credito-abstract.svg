<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="caArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1EA6FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1EA6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="caNodeGlow">
      <stop offset="0" stop-color="#1EA6FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1EA6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="caAmbient">
      <stop offset="0" stop-color="#1EA6FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1EA6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="caBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- ambient depth -->
  <circle cx="430" cy="170" r="210" fill="url(#caAmbient)"/>

  <!-- abstract rounded panels (upper-left) -->
  <rect x="62" y="58" width="150" height="52" rx="22" fill="#0D4D9B" opacity="0.5"/>
  <rect x="94" y="122" width="104" height="40" rx="18" fill="#1EA6FF" opacity="0.16"/>

  <!-- area under the flow -->
  <path d="M70 285 C150 278 200 235 250 228 C330 219 388 152 460 150 C510 148 545 120 575 96 L575 300 L70 300 Z" fill="url(#caArea)"/>

  <!-- glow trace -->
  <path d="M70 285 C150 278 200 235 250 228 C330 219 388 152 460 150 C510 148 545 120 575 96"
        fill="none" stroke="#1EA6FF" stroke-width="8" stroke-opacity="0.35"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#caBlur)"/>

  <!-- flow curve -->
  <path d="M70 285 C150 278 200 235 250 228 C330 219 388 152 460 150 C510 148 545 120 575 96"
        fill="none" stroke="#1EA6FF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nodes on the flow -->
  <circle cx="70"  cy="285" r="5" fill="#1EA6FF" opacity="0.9"/>
  <circle cx="250" cy="228" r="5" fill="#1EA6FF"/>
  <circle cx="460" cy="150" r="6" fill="#1EA6FF"/>

  <!-- destination node -->
  <circle cx="575" cy="96" r="56" fill="url(#caNodeGlow)"/>
  <circle cx="575" cy="96" r="11" fill="#1EA6FF"/>
  <circle cx="575" cy="96" r="4.5" fill="#EAF6FF"/>

  <!-- scattered accents -->
  <circle cx="150" cy="250" r="2"   fill="#1EA6FF" opacity="0.40"/>
  <circle cx="360" cy="252" r="2.5" fill="#1EA6FF" opacity="0.35"/>
  <circle cx="432" cy="256" r="1.8" fill="#FFFFFF" opacity="0.30"/>
  <circle cx="520" cy="210" r="2"   fill="#1EA6FF" opacity="0.40"/>
  <circle cx="602" cy="206" r="2.2" fill="#1EA6FF" opacity="0.30"/>
  <circle cx="300" cy="300" r="1.8" fill="#1EA6FF" opacity="0.30"/>
  <circle cx="512" cy="296" r="2"   fill="#FFFFFF" opacity="0.22"/>
</svg>
